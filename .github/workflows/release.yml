name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package
        run: pnpm electron-builder --${{ matrix.platform }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_IDENTITY: ""
          CSC_LINK: ""
          WIN_CSC_LINK: ""

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          for f in \
            dist/*.exe dist/*.msi dist/*.dmg dist/*.pkg dist/*.zip \
            dist/*.AppImage dist/*.deb dist/*.rpm dist/*.tar.gz \
            dist/*.pacman dist/*.yml dist/*.blockmap
          do
            cp "$f" artifacts/
          done
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NOTES="$(cat <<EOF
          Build automático da \`main\` (\`${SHORT_SHA}\`).

          Baixe o instalador da sua plataforma:
          - Windows: \`.exe\` ou \`.zip\`
          - macOS: \`.dmg\` ou \`.zip\`
          - Linux: AppImage, \`.deb\`, \`.rpm\` ou \`.tar.gz\`
          EOF
          )"

          files=(artifacts/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum instalador para publicar."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --title "v${VERSION}" --notes "$NOTES" --latest
          else
            gh release create "$TAG" "${files[@]}" --title "v${VERSION}" --notes "$NOTES" --latest
          fi
